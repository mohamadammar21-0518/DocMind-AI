<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DocMind AI favicon">
  <!--
    Favicon — same mark as logo.svg, same proportions, same element placement.
    Simplified for legibility at 16–32px: thicker strokes, no dashed ring,
    no connection lines/dots (too small to read), stronger contrast.
  -->
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <linearGradient id="fbrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="fng" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background — identical rounded square as logo -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#fbg)"/>

  <!-- Background glow echo -->
  <ellipse cx="300" cy="200" rx="220" ry="180" fill="url(#fglow)"/>

  <!-- ── Document: same path as logo.svg ── -->
  <!-- Main page body -->
  <path
    d="M148 124 L314 124 L368 178 L368 394 Q368 406 356 406 L148 406 Q136 406 136 394 L136 136 Q136 124 148 124 Z"
    fill="#1a1a2e"
    stroke="url(#fbrand)"
    stroke-width="5"
  />
  <!-- Folded corner triangle -->
  <path
    d="M314 124 L314 178 L368 178 Z"
    fill="#0d0d1a"
    stroke="url(#fbrand)"
    stroke-width="5"
  />
  <!-- Fold crease — slightly bolder than logo for favicon visibility -->
  <line x1="314" y1="124" x2="368" y2="178" stroke="#a78bfa" stroke-width="3" opacity="0.7"/>

  <!-- ── Text lines — same positions as logo, slightly thicker ── -->
  <g opacity="0.7">
    <rect x="168" y="218" width="140" height="9"  rx="4.5" fill="url(#fbrand)"/>
    <rect x="168" y="244" width="160" height="9"  rx="4.5" fill="#6366f1"/>
    <rect x="168" y="270" width="120" height="9"  rx="4.5" fill="#6366f1"/>
    <rect x="168" y="306" width="150" height="9"  rx="4.5" fill="#6366f1"/>
    <rect x="168" y="332" width="110" height="9"  rx="4.5" fill="#6366f1"/>
  </g>

  <!-- ── Neural node — same cx/cy as logo (342, 182) ── -->
  <!-- Soft outer glow -->
  <circle cx="342" cy="182" r="54" fill="#7c3aed" opacity="0.2" filter="url(#fng)"/>
  <!-- Node core — filled gradient, same as logo -->
  <circle cx="342" cy="182" r="26" fill="url(#fbrand)" filter="url(#fng)"/>
  <!-- Inner bright centre — slightly larger for favicon pop -->
  <circle cx="342" cy="182" r="12" fill="#ede9fe"/>
</svg>
