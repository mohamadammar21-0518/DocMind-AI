<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DocMind AI logo">
  <defs>
    <!-- Background gradient: deep navy → near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>

    <!-- Primary brand gradient: violet → indigo -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent glow gradient for the neural node -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner-shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>

    <!-- Glow filter for node -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip path — rounded square card -->
    <clipPath id="card">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- ── Card background ───────────────────────────────────── -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle radial glow in the background -->
  <ellipse cx="300" cy="200" rx="220" ry="180" fill="url(#glow)" opacity="0.18"/>

  <!-- ── Document body ─────────────────────────────────────── -->
  <!-- Page shape: rounded rect with folded top-right corner -->
  <g filter="url(#softShadow)">
    <!-- Main page -->
    <path
      d="M148 124 L314 124 L368 178 L368 394 Q368 406 356 406 L148 406 Q136 406 136 394 L136 136 Q136 124 148 124 Z"
      fill="#1a1a2e"
      stroke="url(#brand)"
      stroke-width="3"
      opacity="0.95"
    />
    <!-- Folded corner triangle -->
    <path
      d="M314 124 L314 178 L368 178 Z"
      fill="#0d0d1a"
      stroke="url(#brand)"
      stroke-width="3"
    />
    <!-- Fold crease highlight -->
    <path
      d="M314 124 L368 178"
      stroke="#a78bfa"
      stroke-width="2"
      opacity="0.5"
    />
  </g>

  <!-- ── Text lines on the document (representing content) ── -->
  <g opacity="0.55">
    <rect x="168" y="218" width="140" height="7"  rx="3.5" fill="url(#brand)"/>
    <rect x="168" y="241" width="160" height="7"  rx="3.5" fill="#6366f1"/>
    <rect x="168" y="264" width="120" height="7"  rx="3.5" fill="#6366f1"/>
    <rect x="168" y="300" width="150" height="7"  rx="3.5" fill="#6366f1"/>
    <rect x="168" y="323" width="110" height="7"  rx="3.5" fill="#6366f1"/>
    <rect x="168" y="346" width="130" height="7"  rx="3.5" fill="#6366f1"/>
  </g>

  <!-- ── Neural node cluster (top-right, overlapping corner) -->
  <!-- Outer glow ring -->
  <circle cx="342" cy="182" r="52" fill="#7c3aed" opacity="0.15" filter="url(#nodeGlow)"/>
  <!-- Mid ring -->
  <circle cx="342" cy="182" r="36"
    fill="none"
    stroke="url(#brand)"
    stroke-width="2"
    opacity="0.4"
    stroke-dasharray="6 4"
  />
  <!-- Node core -->
  <circle cx="342" cy="182" r="22" fill="url(#brand)" filter="url(#nodeGlow)"/>
  <!-- Inner bright centre -->
  <circle cx="342" cy="182" r="10" fill="#ede9fe"/>

  <!-- Neural connection lines -->
  <g stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
    <line x1="342" y1="160" x2="342" y2="140"/>
    <line x1="360" y1="168" x2="376" y2="155"/>
    <line x1="364" y1="190" x2="383" y2="195"/>
    <line x1="320" y1="172" x2="304" y2="160"/>
  </g>
  <!-- Connection node dots -->
  <g fill="#c4b5fd">
    <circle cx="342" cy="136" r="4"/>
    <circle cx="379" cy="152" r="4"/>
    <circle cx="386" cy="197" r="4"/>
    <circle cx="300" cy="157" r="4"/>
  </g>

  <!-- ── "D" lettermark hint — tiny brand initial in node ── -->
  <!-- (the white dot centre serves as the mark) -->
</svg>
