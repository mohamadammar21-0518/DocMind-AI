services:
  - type: web
    name: docmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://docmind-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
